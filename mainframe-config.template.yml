# mainframe-config.yml -- copy to .specify/extensions/mainframe/mainframe-config.yml and edit.
# Environment overrides: SPECKIT_MAINFRAME_<KEY>. Never put credentials here.

source_path: "../legacy-cobol-app"        # the COBOL application; opened read-only, never written to
output_path: "../legacy-cobol-app-modernized"

profile: "spring-postgres-react-aws"       # profiles/*.yaml
industry: "banking"                        # compliance-packs/*
database: "postgresql"
ui: "react"
cloud: "aws"

approvers:                                 # ids recorded in every gate decision
  G1: [business-analyst, architect, product-owner]
  G2: [architect, product-owner, domain-sme]
  G3: [chief-architect, product-owner, ops-lead]
  G4: [data-architect, dba, compliance]
  G5: [tech-lead, security]
  G6: [product-owner, qa-lead, business-analyst]
  G7: [change-advisory-board, ops, business-owner]

auto_approve: null                         # an approver id enables unattended runs: green -> approved-with-conditions, red -> waived (never approved)
authorization: "proceed on all gates without asking for external approval"
